<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#07090a;overflow:hidden}
svg{display:block}
image{image-rendering:auto}  /* the art is drawn big and always shrunk here; 'pixelated' drops and doubles pixels when shrinking */
.disp{font-family:Outfit;font-weight:600;fill:#f3f6f2;letter-spacing:-0.02em}
.txt{font-family:Outfit;fill:rgb(243 246 242 / 0.62)}
.dim{font-family:'JetBrains Mono';fill:rgb(243 246 242 / 0.38)}
.mono{font-family:'JetBrains Mono';font-weight:500}
.neon{fill:#6dff4f}
.panel{fill:#0c110e;stroke:rgb(255 255 255 / 0.09);stroke-width:2}
.flow{fill:none;stroke:#6dff4f;stroke-width:4;stroke-dasharray:2 14;stroke-linecap:round}
</style></head><body><svg width="1600" height="900" viewBox="0 0 1600 900"><defs>
<linearGradient id="sol" x1="8.5" y1="90" x2="89" y2="-3" gradientUnits="userSpaceOnUse">
<stop offset="0.08" stop-color="#9945FF"/><stop offset="0.3" stop-color="#8752F3"/><stop offset="0.5" stop-color="#5497D5"/>
<stop offset="0.6" stop-color="#43B4CA"/><stop offset="0.72" stop-color="#28E0B9"/><stop offset="0.97" stop-color="#19FB9B"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6dff4f" stop-opacity="0.30"/><stop offset="1" stop-color="#6dff4f" stop-opacity="0"/></radialGradient>
<filter id="tree-glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#6eff5a" flood-opacity="0.35"/></filter>
<filter id="land-glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4"/></filter>
<pattern id="map-grid" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#9fc4ff" stroke-opacity="0.1" stroke-width="0.08"/></pattern>
<linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#07090a" stop-opacity="1"/><stop offset="0.42" stop-color="#07090a" stop-opacity="0.92"/><stop offset="0.62" stop-color="#07090a" stop-opacity="0.15"/><stop offset="1" stop-color="#07090a" stop-opacity="0"/></linearGradient>
</defs><rect width="1600" height="900" fill="#07090a"/><text x="100" y="170" class="disp" font-size="78" text-anchor="start">Your tree grows <tspan class="neon">with your coin.</tspan></text><circle cx="240.0" cy="591.0" r="77.0" fill="url(#glow)" opacity="0.4"/><image href="tree-0-seed.png" x="170.0" y="500" width="140" height="140" filter="url(#tree-glow)"/><text x="240.0" y="710" class="disp" font-size="38" text-anchor="middle">Seed</text><text x="240.0" y="752" class="mono" fill="rgb(243 246 242 / 0.55)" font-size="26" text-anchor="middle">at launch</text><circle cx="520.0" cy="577.0" r="99.00000000000001" fill="url(#glow)" opacity="0.55"/><image href="tree-1-sprout.png" x="430.0" y="460" width="180" height="180" filter="url(#tree-glow)"/><text x="520.0" y="710" class="disp" font-size="38" text-anchor="middle">Sprout</text><text x="520.0" y="752" class="mono" fill="rgb(243 246 242 / 0.55)" font-size="26" text-anchor="middle">$10k</text><circle cx="800.0" cy="563.0" r="121.00000000000001" fill="url(#glow)" opacity="0.7"/><image href="tree-2-sapling.png" x="690.0" y="420" width="220" height="220" filter="url(#tree-glow)"/><text x="800.0" y="710" class="disp" font-size="38" text-anchor="middle">Sapling</text><text x="800.0" y="752" class="mono" fill="rgb(243 246 242 / 0.55)" font-size="26" text-anchor="middle">$50k</text><circle cx="1080.0" cy="549.0" r="143.0" fill="url(#glow)" opacity="0.85"/><image href="tree-3-tree.png" x="950.0" y="380" width="260" height="260" filter="url(#tree-glow)"/><text x="1080.0" y="710" class="disp" font-size="38" text-anchor="middle">Tree</text><text x="1080.0" y="752" class="mono" fill="rgb(243 246 242 / 0.55)" font-size="26" text-anchor="middle">$250k</text><circle cx="1360.0" cy="535.0" r="165.0" fill="url(#glow)" opacity="1.0"/><image href="tree-4-giant.png" x="1210.0" y="340" width="300" height="300" filter="url(#tree-glow)"/><text x="1360.0" y="710" class="disp neon" font-size="38" text-anchor="middle">Giant</text><text x="1360.0" y="752" class="mono" fill="rgb(243 246 242 / 0.55)" font-size="26" text-anchor="middle">$1M</text><path d="M100 644H1500" stroke="rgb(255 255 255 / 0.10)" stroke-width="2"/><text x="800" y="850" class="dim" font-size="24" text-anchor="middle">Every coin on Treepad gets its own tree. Market cap sets its size.</text></svg></body></html>
