:root{--navy:#0b1238;--ink:#070b24;--teal:#0e5e63;--red:#ff3b30;--white:#f7f5ee;--sky:#8fd3ff;--yellow:#ffd23f}
*{box-sizing:border-box}html{background:var(--ink)}
body{margin:0;color:var(--white);font:16px/1.5 Sans,system-ui,sans-serif;background:var(--ink)}
.wrap{max-width:1160px;margin:0 auto;padding:32px 20px 64px}
header{background:var(--teal);border:3px solid var(--navy);box-shadow:6px 6px 0 var(--navy);padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
header img.mark{width:132px;height:132px;image-rendering:pixelated;border:3px solid var(--navy)}
header img.word{height:110px;max-width:100%;object-fit:contain}
h1,h2{font-family:Jersey,monospace;font-weight:400;letter-spacing:.02em;margin:0}
h1{font-size:56px;line-height:1}
.pitch{margin:8px 0 0;font-size:17px;max-width:560px}
h2{font-size:40px;color:var(--yellow);margin-top:48px}
.blurb{margin:4px 0 18px;color:#c9cbe0}
.grid{display:grid;gap:18px}
.grid.logo{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.wordmark{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grid.banner{grid-template-columns:1fr}
.card{margin:0;background:var(--navy);border:3px solid #1f2a66;box-shadow:4px 4px 0 #000}
.card img{display:block;width:100%;height:auto}
.card.logo img{image-rendering:pixelated}
figcaption{font-size:14px;padding:8px 12px;color:#d9dbee;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dl{font-family:Jersey,monospace;font-size:20px;line-height:1;color:var(--navy);background:var(--yellow);border:3px solid var(--navy);box-shadow:3px 3px 0 #000;padding:6px 12px 7px;text-decoration:none;white-space:nowrap}
.dl small{font-family:Sans,system-ui,sans-serif;font-size:12px;opacity:.75;margin-left:4px}
.dl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.pick h2{color:var(--red)}
.pair{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:18px;align-items:start}
@media(max-width:640px){h1{font-size:44px}header img.mark{width:96px;height:96px}header img.word{height:72px}.pair{grid-template-columns:1fr}h2{font-size:32px}}
